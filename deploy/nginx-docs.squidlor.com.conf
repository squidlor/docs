# Squidlor docs — docs.squidlor.com
#
# Static SPA. Deploy by rsyncing `dist/` to the web root, then reloading nginx.
#
#   npm run build
#   rsync -avz --delete dist/ <user>@<docs-host>:/var/www/docs.squidlor.com/
#
# TLS is issued with certbot, matching the api/admin hosts:
#   certbot --nginx -d docs.squidlor.com
# Certbot rewrites the :80 server block to redirect and injects the ssl_*
# directives into the :443 block, so install this file first, then run it.

server {
    listen 80;
    listen [::]:80;
    server_name docs.squidlor.com;

    # certbot replaces this block with a 301 to https once the cert is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.squidlor.com;

    root /var/www/docs.squidlor.com;
    index index.html;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    access_log /var/log/nginx/docs.squidlor.com.access.log;
    error_log  /var/log/nginx/docs.squidlor.com.error.log;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # The docs are entirely self-contained apart from Google Fonts, which the
    # stylesheet imports. Keep this in sync if that ever changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or a deploy leaves clients holding a
    # stale document that references asset hashes no longer on disk.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: every unknown path is a docs route, not a 404.
    # The app renders its own not-found page for genuinely bad slugs.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
