<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/squidlor-mark.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/squidlor-mark-64.png" />
    <link rel="apple-touch-icon" href="/squidlor-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Squidlor documentation — the self-owned, multi-source on-chain price oracle for crypto and tokenized equities. API reference, smart-contract interfaces, integration guides, and deployed addresses."
    />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Squidlor Docs</title>
    <script>
      // Applied before first paint so the initial render never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("squidlor-docs-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
