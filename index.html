<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/squidlor-mark.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/squidlor-mark-64.png" />
    <link rel="apple-touch-icon" href="/squidlor-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Squidlor documentation — the self-owned, multi-source on-chain price oracle for crypto and tokenized equities. API reference, smart-contract interfaces, integration guides, and deployed addresses."
    />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Squidlor Docs</title>
    <script>
      // Applied before first paint so the initial render never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("squidlor-docs-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      First-paint splash. Shown before the JS bundle has downloaded, styled by
      squid-loader.css (bundled into the head stylesheet, so never unstyled).
      Removed by hideSplash() in src/components/splash.ts once React has painted.
      Same mark as <BrandLoader/>; the copy is identical in every Squidlor app.
    -->
    <div id="splash" class="squid-splash" role="status" aria-live="polite" aria-label="Loading Squidlor" style="--squid-splash-bg: var(--bg, #ffffff); --squid-splash-fg: var(--fg, #14141b); --squid-splash-font: system-ui, -apple-system, sans-serif">
      <div class="squid-splash__stack">
        <div class="squid-loader" style="width: 96px; height: 104px">
          <div class="squid-loader__glow"></div>
          <svg class="squid-loader__mark" width="96" height="104" viewBox="0 0 33 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="splash-body" gradientUnits="userSpaceOnUse" x1="16" y1="20" x2="16" y2="34">
                <stop offset="0" stop-color="#9B7BFF" />
                <stop offset="1" stop-color="#6A3DF0" />
              </linearGradient>
              <linearGradient id="splash-arc" gradientUnits="userSpaceOnUse" x1="8" y1="2" x2="24" y2="22">
                <stop offset="0" stop-color="#FFFFFF" />
                <stop offset="1" stop-color="#7B4DFF" />
              </linearGradient>
            </defs>
            <ellipse class="squid-loader__ring" cx="15.864" cy="12.303" rx="7.361" ry="9.726" stroke-width="5.155" />
            <ellipse class="squid-loader__arc" cx="15.864" cy="12.303" rx="7.361" ry="9.726" stroke-width="5.155" pathLength="100" stroke="url(#splash-arc)" />
            <path class="squid-loader__arm" style="transform-origin: 16.18px 24.87px; --d: 0s" d="M16.1836 24.8726L16.1836 33.3369" stroke="url(#splash-body)" stroke-width="4.305" />
            <path class="squid-loader__arm" style="transform-origin: 10.23px 20.41px; --s: 1; --d: -0.3s" d="M10.2305 20.4082C9.92045 22.2814 7.87077 25.77 2.15221 24.7389" stroke="url(#splash-body)" stroke-width="4.305" />
            <path class="squid-loader__arm" style="transform-origin: 22.13px 20.41px; --s: -1; --d: -0.3s" d="M22.1348 20.4082C22.4448 22.2814 24.4945 25.77 30.213 24.7389" stroke="url(#splash-body)" stroke-width="4.305" />
            <path class="squid-loader__arm" style="transform-origin: 13.26px 23.6px; --s: 1; --d: -0.6s" d="M13.2598 23.5969C12.9497 25.4701 9.25253 33.1846 3.53397 32.1535" stroke="url(#splash-body)" stroke-width="4.305" />
            <path class="squid-loader__arm" style="transform-origin: 19.11px 23.6px; --s: -1; --d: -0.6s" d="M19.1055 23.5969C19.4155 25.4701 23.1127 33.1846 28.8313 32.1535" stroke="url(#splash-body)" stroke-width="4.305" />
          </svg>
        </div>
        <div class="squid-splash__text">
          <div class="squid-splash__word">Squidlor</div>
          <div class="squid-splash__caption">Loading docs</div>
        </div>
      </div>
      <p class="squid-splash__hint">Taking longer than usual. Check your connection, or reload the page.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
